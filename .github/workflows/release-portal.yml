# Builds the portal on GitHub's machines and hands it to the Lightsail server.
# Runs on a push to the "release" branch, or by hand from the Actions tab.
# The server keeps the previous build and rolls back by itself if the new one does not start.
name: Release portal

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: release-portal
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Tests (payroll engine tests are added here as they are written)
        run: npm test --if-present

      - name: Build (standalone)
        run: npm run build
        env:
          STANDALONE: "1"

      - name: Package
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          tar -czf release.tgz -C .next/standalone .
          ls -lh release.tgz

      - name: Hand over to the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_KEY" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "::warning::Deploy secrets are not set yet - the build was checked, nothing was released."
            exit 0
          fi
          # Secrets pasted from Windows can carry \r, spaces or an https:// prefix - clean them, then check each one.
          HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]' | sed -E 's#^[a-z]+://##; s#/.*$##')"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::DEPLOY_KEY is not a valid private key. Paste the whole file ~/.ssh/vec-deploy (not .pub), from -----BEGIN to -----END lines."
            exit 1
          fi
          if ! ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error::DEPLOY_KNOWN_HOSTS has no line for $HOST. Paste known_hosts.txt (the line starting with $HOST ssh-ed25519)."
            exit 1
          fi
          REL="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 "vec@${HOST}" "$REL" < release.tgz
          echo "Released $REL to https://${HOST}"
